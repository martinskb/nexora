<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1d6b47" />
    <!-- Declara suporte a claro/escuro: navegadores não forçam o "modo noturno" por cima. -->
    <meta name="color-scheme" content="light dark" />
    <script>
      // Aplica o tema salvo antes de desenhar a página (evita "piscar" a cor errada).
      try {
        var t = localStorage.getItem('nexora-tema');
        if (t === 'claro' || t === 'escuro') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta name="description" content="NEXORA — vendas e estoque juntos, de um jeito simples." />
    <title>NEXORA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
